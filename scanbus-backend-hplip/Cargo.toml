[package]
name = "scanbus-backend-hplip"
description = "HP backend for scanbus (hplip walk-up scanning)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
scanbus-backend-common = { workspace = true, features = ["mdns"] }
scanbus-core.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# For `ServiceInfo`: the records the mDNS filter reads come from the browse helper in
# scanbus-backend-common, which hands them over in mdns-sd's own type.
mdns-sd.workspace = true
# The walk-up destination collection, whose entries this backend deletes by URI.
quick-xml.workspace = true
# `net`, `io-util` and `time` are the walk-up transport: HTTP/1.1 over a TcpStream to the
# device's embedded server, with one timeout around the whole exchange. Three request
# shapes to a plain-HTTP server on the LAN is not enough to justify reqwest, hyper and a
# TLS trust store in the daemon.
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tracing.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
