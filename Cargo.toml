[workspace]
resolver = "3"
members = [
    "scanbus-core",
    "scanbus-daemon",
    "scanbus-backend-brother",
    "scanbus-backend-hplip",
]
# `cargo build` with no `--workspace` builds only these two. The backend crates are
# reachable through the daemon's `brother` / `hplip` features, so the default build
# never compiles hardware-specific code — see scanbus-daemon/Cargo.toml.
default-members = ["scanbus-core", "scanbus-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. The development machine runs rustc 1.93.1 installed from a source tarball,
# not rustup, so there is deliberately no rust-toolchain.toml to act on: cargo
# enforces this field itself and errors on an older compiler.
rust-version = "1.93"
repository = "https://github.com/jeanparpaillon/scanbus_service"

# Single source of truth for versions across the four crates. Members refer to these
# with `dep = { workspace = true }` and never pin a version of their own.
[workspace.dependencies]
scanbus-core = { path = "scanbus-core", version = "0.1.0" }
scanbus-backend-brother = { path = "scanbus-backend-brother", version = "0.1.0" }
scanbus-backend-hplip = { path = "scanbus-backend-hplip", version = "0.1.0" }

async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
# Test-only in scanbus-core: the model's serde impls are only worth asserting against a
# real self-describing format, and JSON is also what the pairing store will use (4.1).
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
