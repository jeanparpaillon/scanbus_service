[workspace]
resolver = "3"
members = [
    "scanbus-core",
    "scanbus-client",
    "scanbus-cli",
    "scanbus-daemon",
    "scanbus-backend-brother",
    "scanbus-backend-hplip",
    "scanbus-backend-mobile",
]
# `cargo build` with no `--workspace` builds these five members. The mobile backend is
# a pure protocol crate that CI can exercise without hardware, so it is compiled by
# default; hardware-specific backends stay opt-in through daemon features.
default-members = [
    "scanbus-core",
    "scanbus-client",
    "scanbus-cli",
    "scanbus-daemon",
    "scanbus-backend-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. The development machine runs rustc 1.93.1 installed from a source tarball,
# not rustup, so there is deliberately no rust-toolchain.toml to act on: cargo
# enforces this field itself and errors on an older compiler.
rust-version = "1.93"
repository = "https://github.com/jeanparpaillon/scanbus_service"

# Single source of truth for versions across the four crates. Members refer to these
# with `dep = { workspace = true }` and never pin a version of their own.
[workspace.dependencies]
scanbus-core = { path = "scanbus-core", version = "0.1.0" }
scanbus-client = { path = "scanbus-client", version = "0.1.0" }
scanbus-backend-brother = { path = "scanbus-backend-brother", version = "0.1.0" }
scanbus-backend-hplip = { path = "scanbus-backend-hplip", version = "0.1.0" }
scanbus-backend-mobile = { path = "scanbus-backend-mobile", version = "0.1.0" }

async-trait = "0.1"
flume = "0.11"
# The CLI's only non-scanbus surface of its own. `derive` is not enabled here: the
# feature is turned on in scanbus-cli, so a future consumer of clap in this workspace —
# a test helper, say — does not silently pull the macro crate in.
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "wrap_help",
] }
clap_complete = "4"
clap_mangen = "0.2"
futures-core = "0.3"
if-addrs = "0.13"
mdns-sd = "0.13"
# Test-only so far: core's own tests consume the backend streams, the daemon will do it
# for real. Kept out of core's [dependencies] so the library itself stays on
# futures-core, which is the one that only defines `Stream`.
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "tiff"] }
lopdf = "0.38"
# The pairing nonce (9.3): six digits, uniform, from a CSPRNG.
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# Test-only in scanbus-core: the model's serde impls are only worth asserting against a
# real self-describing format, and JSON is also what the pairing store will use (4.1).
# A real dependency in scanbus-cli, where `--json` is half the output contract (§6).
serde_json = "1"
thiserror = "2"
# Only the feature every member needs. The runtime ones belong to whoever starts a
# runtime — see scanbus-daemon/Cargo.toml — so core does not drag mio and the signal
# handling into its tree just by using a channel.
tokio = { version = "1", features = ["sync"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# For the daemon and the client crate, and deliberately not in scanbus-core's tree — the
# split is the whole point of both crates existing; scripts/check-deps.sh
# fails the build if it ever gets there. `default-features = false` drops the async-io
# executor: the daemon already runs on tokio, and pulling in a second reactor to serve
# the same connection is how zbus deadlocks. `blocking-api` goes with it, since every
# call site here is async.
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
