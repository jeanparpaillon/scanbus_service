[package]
name = "scanbus-core"
description = "Domain model, backend trait and state machines for scanbus — free of any D-Bus dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# `mock` exports the fake backend to other crates; inside this crate it is compiled for
# `cargo test` regardless, so `cargo test` here needs no feature flag. The daemon's
# tests (2.8) enable it as `scanbus-core = { workspace = true, features = ["mock"] }`.
[features]
mock = []

# Nothing here may pull in zbus or dbus, directly or transitively: everything worth
# testing (the pairing state machine, the profile pipeline, the button -> profile
# mapping) has to be reachable without a bus connection. scripts/check-core-deps.sh
# enforces it, and CI runs that script.
[dependencies]
async-trait.workspace = true
futures-core.workspace = true
serde.workspace = true
thiserror.workspace = true
# `sync` for the mpsc/watch channels the trait and the pairing machine are built on;
# `rt` because `PairingMachine` (1.4) spawns the driver task itself — cancellation is
# `AbortHandle::abort` on that task, so the spawn has to happen here rather than be
# handed back to whoever calls `pair()`. Starting the runtime itself is still the
# daemon's business.
tokio = { workspace = true, features = ["sync", "rt"] }

# Round-trip tests need a self-describing format to round-trip through. JSON is not a
# wire format of this project — the wire format is `a{sv}`, produced in the daemon —
# so this stays a dev-dependency.
[dev-dependencies]
# Stream combinators (`next`, `collect`) and `poll!`, which is how the cancellation test
# drops a future mid-flight without a timer. Consumers of the streams live in the
# daemon, so this is not a dependency of the library itself.
futures-util.workspace = true
serde_json.workspace = true
# `time` is test-only: the pairing machine's own tests bound how long they wait for a
# transition and how long they give an aborted task to unwind, so a bug fails the test
# instead of hanging CI. Production code has no timers.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
