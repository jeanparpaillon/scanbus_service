[package]
name = "scanbus-gui"
description = "GNOME client for the scanbus D-Bus API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# The default suite stays headless; the handful of widget binding assertions run only
# when CI (or a developer) asks for them explicitly under xvfb-run.
gtk-tests = []

[[bin]]
name = "scanbus-gui"
path = "src/main.rs"

[dependencies]
scanbus-client.workspace = true
scanbus-core.workspace = true
async-channel = "2"
futures-util.workspace = true
gtk4 = { version = "0.10", features = ["v4_10"] }
libc = "0.2"
libadwaita = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
zbus.workspace = true
