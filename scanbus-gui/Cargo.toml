[package]
name = "scanbus-gui"
description = "GNOME client for the scanbus D-Bus API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "scanbus-gui"
path = "src/main.rs"

[dependencies]
scanbus-client.workspace = true
scanbus-core.workspace = true
async-channel = "2"
futures-util.workspace = true
gtk4 = "0.10"
libc = "0.2"
libadwaita = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
zbus.workspace = true
