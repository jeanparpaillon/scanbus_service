[package]
name = "scanbus-daemon"
description = "scanbus D-Bus service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# A library beside the binary, so that the D-Bus surface can be driven from integration
# tests — 2.8 stands the whole contract up on a private bus, and a `[[bin]]`-only crate
# is unreachable from `tests/`. `main.rs` is then only the wiring.
[lib]
name = "scanbus_daemon"
path = "src/lib.rs"

[[bin]]
name = "scanbus-daemon"
path = "src/main.rs"

# Both backends are off by default: they shell out to hardware-specific tooling that
# CI does not have. `cargo build` compiles neither crate.
[features]
default = []
brother = ["dep:scanbus-backend-brother"]
hplip = ["dep:scanbus-backend-hplip"]

[dependencies]
scanbus-core.workspace = true
# `PairingStore` is `#[async_trait]`, so implementing it here needs the same macro.
async-trait.workspace = true
scanbus-backend-brother = { workspace = true, optional = true }
scanbus-backend-hplip = { workspace = true, optional = true }
# `StreamExt::next` and `BoxStream`, for the task that consumes a backend's button
# stream (2.4). Core stays on `futures-core`, which only defines the trait; the daemon is
# where the streams are actually driven.
futures-util.workspace = true
# The runtime lives here, not in the workspace defaults: `signal` is what the shutdown
# path needs, `rt-multi-thread` what `#[tokio::main]` starts, and `time` what bounds a
# backend probe (2.2) — a hung `discover()` must not hold up the round.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
image.workspace = true
lopdf.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zbus.workspace = true

[dev-dependencies]
# `mock` for the tests only: every acceptance test of workstream 2 drives the D-Bus
# surface through `MockBackend`, and the daemon itself must not be able to reach for it.
scanbus-core = { workspace = true, features = ["mock"] }
# The proxies the tests drive the daemon through are the CLI's, not copies of them: an
# interface changed on one side and not the other is then a compile error here rather
# than a stale client discovered by a user (scanbus-cli.md §2). A dev-dependency and
# never a dependency — the daemon must be buildable without its own client.
scanbus-client.workspace = true
# The private-bus harness in tests/ drives the registry against a real `dbus-daemon`,
# and reads its address off a pipe — hence `io-util`, `process` and the timeouts that
# stop a missing signal from hanging the suite. The daemon itself needs none of them.
tokio = { workspace = true, features = ["io-util", "process", "time"] }
