name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A release is a single set of artifacts for one commit; a re-run supersedes the one
# in flight rather than racing it to the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.93.1

jobs:
  # The artifacts are named after VERSION, not after the tag: debian/rules reads the
  # same file, so anything else would name the .debs one thing and the tarball another.
  # On a tag push all three — tag, VERSION, and the copies in Cargo.toml and
  # debian/changelog — have to agree, and finding out here costs a runner start
  # instead of a full release build.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          ./scripts/version.sh check
          version=$(./scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Releasing $version"

  source:
    name: source tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `git archive` of the checked-out commit: the tarball is exactly the tracked
      # tree, so it cannot pick up target/, .worktrees/ or anything else a build left
      # behind. debian/ is tracked and stays in, which is what makes the tarball
      # buildable on its own.
      - name: Build tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="scanbus-$VERSION/" \
            -o "dist/scanbus-$VERSION.tar.gz" HEAD

      - name: Check it unpacks and carries debian/
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tar -tzf "dist/scanbus-$VERSION.tar.gz" \
            "scanbus-$VERSION/debian/rules" \
            "scanbus-$VERSION/Cargo.lock" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  build-deb:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            artifact: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --no-sign because the signature is applied by the next step instead, outside
      # the container. The action builds an --env-file out of this step's entire
      # environment and hands it to `docker run`, so a key put here would be readable
      # by every build script cargo executes. Signing in-place would also fail open:
      # dpkg-buildpackage only warns when it cannot sign, which is how a release goes
      # out unsigned and green.
      - name: Build Debian packages
        id: build
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: ${{ matrix.image }}
          buildpackage-opts: --build=binary --no-sign
          artifacts-dir: artifacts

      # `gpg --clearsign` over the .changes is exactly what dpkg-buildpackage's own
      # signing does. The .buildinfo is left unsigned: the .changes carries its
      # checksum, so the one signature already covers it.
      #
      # debian/scanbus-ci.pub.asc is the key users verify with, which makes it the
      # authority on what CI may sign with — the wrong secret has to fail the build
      # rather than ship a signature nobody can check.
      - name: Sign .changes
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is empty — refusing to ship unsigned packages"
            exit 1
          fi

          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT

          expected=$(gpg --batch --show-keys --with-colons debian/scanbus-ci.pub.asc |
            awk -F: '/^pub:/ { print $5; exit }')

          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          keyid=$(gpg --batch --list-secret-keys --with-colons |
            awk -F: '/^sec:/ { print $5; exit }')

          if [ "$keyid" != "$expected" ]; then
            echo "::error::GPG_PRIVATE_KEY is key $keyid, but debian/scanbus-ci.pub.asc is $expected"
            exit 1
          fi

          for changes in artifacts/*.changes; do
            gpg --batch --yes --local-user "$keyid" \
              --clearsign --output "$changes.signed" "$changes"
            mv "$changes.signed" "$changes"
            gpg --batch --verify "$changes"
            echo "signed $(basename "$changes") with $keyid"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: scanbus-${{ matrix.artifact }}
          path: |
            artifacts/*.deb
            artifacts/*.changes
            artifacts/*.buildinfo
          if-no-files-found: error

  publish:
    name: publish release
    needs: [version, source, build-deb]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Downloaded by name rather than "everything", so an artifact added to this run
      # later — an apt-repo dists/ and pool/ tree, say — does not silently become a
      # release asset by way of `gh release create dist/*`.
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: scanbus-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz ./*.deb | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "scanbus $VERSION" \
            --verify-tag \
            --generate-notes \
            dist/*
