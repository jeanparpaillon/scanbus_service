name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A release is a single set of artifacts for one commit; a re-run supersedes the one
# in flight rather than racing it to the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.93.1

jobs:
  # The artifacts are named after VERSION, not after the tag: debian/rules reads the
  # same file, so anything else would name the .debs one thing and the tarball another.
  # On a tag push all three — tag, VERSION, and the copies in Cargo.toml and
  # debian/changelog — have to agree, and finding out here costs a runner start
  # instead of a full release build.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          ./scripts/version.sh check
          version=$(./scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Releasing $version"

  source:
    name: source tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `git archive` of the checked-out commit: the tarball is exactly the tracked
      # tree, so it cannot pick up target/, .worktrees/ or anything else a build left
      # behind. debian/ is tracked and stays in, which is what makes the tarball
      # buildable on its own.
      - name: Build tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="scanbus-$VERSION/" \
            -o "dist/scanbus-$VERSION.tar.gz" HEAD

      - name: Check it unpacks and carries debian/
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tar -tzf "dist/scanbus-$VERSION.tar.gz" \
            "scanbus-$VERSION/debian/rules" \
            "scanbus-$VERSION/Cargo.lock" >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  build-deb:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 LTS
            image: ubuntu:26.04
            artifact: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --no-sign because the signature is applied by the next step instead
      - name: Build Debian packages
        id: build
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: ${{ matrix.image }}
          buildpackage-opts: --build=binary --no-sign
          artifacts-dir: artifacts
          extra-build-deps: curl xz-utils ca-certificates
          before-build-hook: /github/workspace/scripts/install-rust.sh ${{ env.RUST_VERSION }}

      - name: Sign .changes
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: ./scripts/sign-changes.sh artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: scanbus-${{ matrix.artifact }}
          path: |
            artifacts/*.deb
            artifacts/*.changes
            artifacts/*.buildinfo
          if-no-files-found: error

  publish:
    name: publish release
    needs: [version, source, build-deb]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Downloaded by name rather than "everything", so an artifact added to this run
      # later — an apt-repo dists/ and pool/ tree, say — does not silently become a
      # release asset by way of `gh release create dist/*`.
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: scanbus-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz ./*.deb | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "scanbus $VERSION" \
            --verify-tag \
            --generate-notes \
            dist/*
