name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # MSRV, matching `rust-version` in the workspace Cargo.toml and the compiler on the
  # development machine.
  RUST_VERSION: 1.93.1

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      # Cargo.toml's version is a copy of VERSION that only a script keeps current, so
      # nothing else in the build would notice it going stale.
      - run: ./scripts/version.sh check

      - run: cargo fmt --all --check

      # Default features: neither backend is compiled into the daemon, because both
      # shell out to hardware-specific tooling no runner has. GUI linting and tests run
      # in their own job so the headless workspace checks stay that way.
      - run: cargo clippy --workspace --exclude scanbus-gui --all-targets --locked -- -D warnings

      - run: cargo test --workspace --exclude scanbus-gui --locked

  gui:
    name: gui headless + xvfb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component clippy
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-gui-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gui-${{ env.RUST_VERSION }}-

      - run: cargo clippy -p scanbus-gui --all-targets --locked -- -D warnings
      - run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test -p scanbus-gui --locked
      - run: xvfb-run -a env GDK_BACKEND=x11 cargo test -p scanbus-gui --locked --features gtk-tests
      - run: ./scripts/check-deps.sh

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-features-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-features-${{ env.RUST_VERSION }}-

      # Keep the GUI out of CI for now for the same reason as above; we will add a
      # dedicated setup once we are ready to carry its system dependencies here.
      - run: cargo build --workspace --exclude scanbus-gui --locked

      # The backend crates only ever reach the daemon through these features, so this
      # is the one build that links them.
      - run: cargo build -p scanbus-daemon --features brother,hplip,mobile --locked

      - run: cargo clippy -p scanbus-daemon --features brother,hplip,mobile --all-targets --locked -- -D warnings

      # `cargo test` compiles the mock backend for core's own tests, but only this
      # feature exports it as a public module — which is how the daemon's tests get at
      # it, and therefore the shape that has to keep compiling.
      - run: cargo clippy -p scanbus-core --features mock --all-targets --locked -- -D warnings

  crate-isolation:
    name: core has no D-Bus, client has no daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # Reads Cargo.lock and the manifests only; no compilation, so no cache needed.
      - run: ./scripts/check-deps.sh
